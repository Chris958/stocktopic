[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocktopic"
version = "0.11.2"
description = "Market-first A-share theme lifecycle and leader identification system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "certifi==2026.7.22",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.16.4",
  "httpx2==2.12.0",
]

[project.scripts]
stocktopic = "stocktopic.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
stocktopic = ["schema.sql", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
