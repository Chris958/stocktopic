name: StockTopic
options:
  bundleIdPrefix: com.chris958
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StockTopic:
    type: application
    platform: iOS
    sources: [Sources/StockTopicApp]
    info:
      path: Sources/StockTopicApp/Info.plist
      properties:
        CFBundleDisplayName: 题材情绪
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 连接你的Mac mini题材情绪服务。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chris958.stocktopic
        CODE_SIGN_STYLE: Automatic
  StockTopicTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/StockTopicAppTests]
    dependencies:
      - target: StockTopic

